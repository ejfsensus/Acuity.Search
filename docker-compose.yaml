# Acuity.Search Stack Deployment (Local / Self-Hosted)
# SearXNG is an external instance configured via SEARXNG_API_URL and is never a
# bundled container dependency.

services:
  acuity-search:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "bun run db:migrate && bun server.js"
    env_file:
      - .env.local
    ports:
      - '3000:3000'
    environment:
      # Database connection
      - DATABASE_URL=${DATABASE_URL:-postgresql://acuity:acuity_local_password@postgres:5432/acuity_search}
      # Redis cache connection
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # External SearXNG URL (configure in .env.local; never bundled)
      - SEARXNG_API_URL=${SEARXNG_API_URL:-}
      - SEARXNG_SAFESEARCH=${SEARXNG_SAFESEARCH:-0}
      # Multi-user authentication & isolated guest sessions
      - ENABLE_AUTH=${ENABLE_AUTH:-true}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-better-auth}
      - ENABLE_GUEST_CHAT=${ENABLE_GUEST_CHAT:-true}
      # Privacy defaults
      - FAVICON_PROVIDER_URL=${FAVICON_PROVIDER_URL:-off}
      - MORPHIC_UPDATE_CHECK_DISABLED=${MORPHIC_UPDATE_CHECK_DISABLED:-true}
      # Provider-neutral LLM mode
      - ACUITY_SEARCH_LLM_MODE=${ACUITY_SEARCH_LLM_MODE:-unconfigured}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - acuity-network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-acuity}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-acuity_local_password}
      - POSTGRES_DB=${POSTGRES_DB:-acuity_search}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-acuity} -d ${POSTGRES_DB:-acuity_search}'
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acuity-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - acuity-network
    restart: unless-stopped

networks:
  acuity-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
